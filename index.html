<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f5f6fa">
    <meta name="description" content="Find a hackathon, meet your future teammates, and build something that matters with HackMate.">
    <title>HackMate — Your people. Your project. Your moment.</title>
    <script>
      try {
        if (localStorage.getItem("hackmate-theme") === "dark") {
          document.documentElement.dataset.theme = "dark";
          document.querySelector('meta[name="theme-color"]').setAttribute("content", "#10131f");
        }
      } catch (error) {
        // Ignore storage access errors (private mode, disabled cookies).
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
