<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f7f1e6">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
    <meta name="description" content="Find a hackathon, meet your future teammates, and build something that matters with HackMate.">
    <link rel="icon" type="image/svg+xml" href="/logo-mark.svg" />
    <title>HackMate</title>
    <script>
      try {
        if (localStorage.getItem("hackmate-theme") === "dark") {
          document.documentElement.dataset.theme = "dark";
          document.querySelector('meta[name="theme-color"]').setAttribute("content", "#0a0a0a");
        }
      } catch (error) {
        // Ignore storage access errors (private mode, disabled cookies).
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
